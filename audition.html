<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝人徵選 | MORAL 寓意娛樂</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .audition-hero {
            background: linear-gradient(rgba(14, 15, 23, 0.8), rgba(14, 15, 23, 0.9)), url('https://images.unsplash.com/photo-1598387993441-a364f854c3e1?q=80&w=1000&auto=format&fit=crop') center/cover;
            padding: 60px 40px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--moral-purple);
            margin-bottom: 40px;
        }
        .audition-hero h1 { color: #fff; font-size: 32px; margin-bottom: 16px; letter-spacing: 2px; }
        .audition-hero p { color: var(--moral-pink); font-size: 16px; max-width: 600px; margin: 0 auto; line-height: 1.8; }
        
        .section-block { background: var(--surface); padding: 32px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 32px; }
        .section-block h2 { color: var(--text-main); margin-bottom: 20px; font-size: 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px dashed var(--border-color); padding-bottom: 12px; }
        .section-block h2 i { color: var(--moral-purple); }
        .section-desc { color: var(--text-sub); line-height: 1.8; font-size: 15px; margin-bottom: 20px; }

        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .feature-card { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border-left: 3px solid var(--moral-pink); }
        .feature-card h4 { color: #fff; margin-bottom: 8px; font-size: 16px; }
        .feature-card p { color: var(--text-sub); font-size: 13.5px; line-height: 1.6; }

        .req-list { list-style-type: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .req-list li { padding-left: 24px; position: relative; font-size: 14.5px; color: var(--text-sub); line-height: 1.6; }
        .req-list li::before { content: "✦"; position: absolute; left: 0; color: var(--moral-pink); font-size: 12px; top: 4px; }

        .process-steps { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-top: 24px; }
        .step-box { flex: 1; min-width: 120px; text-align: center; background: rgba(196, 148, 249, 0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(196, 148, 249, 0.3); }
        .step-num { font-size: 12px; color: var(--moral-pink); letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .step-name { font-size: 15px; color: #fff; font-weight: bold; }

        .notice-list { list-style-type: decimal; padding-left: 20px; color: var(--text-sub); font-size: 14px; line-height: 1.8; }
        .notice-list li { margin-bottom: 8px; }

        /* 表單專屬樣式 */
        .form-container { background: rgba(0,0,0,0.2); padding: 32px; border-radius: 12px; border: 1px solid var(--moral-purple); margin-top: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-main); font-size: 14.5px; }
        .form-control { width: 100%; padding: 12px 16px; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; }
        .form-control:focus { outline: none; border-color: var(--moral-pink); }
        textarea.form-control { min-height: 120px; resize: vertical; }
        
        .btn-apply { display: block; width: 100%; text-align: center; background: var(--moral-gradient); color: #000; padding: 16px; border-radius: 8px; font-weight: 700; font-size: 16px; text-decoration: none; letter-spacing: 2px; border: none; cursor: pointer; transition: opacity 0.3s; }
        .btn-apply:hover { opacity: 0.9; }
        
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        @media (max-width: 600px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <a href="index.html"><img src="IMG_7225.png" alt="MORAL" class="sidebar-logo"></a>
            <ul class="nav-menu">
                <li><a href="index.html">首頁 / Home</a></li>
                <li><a href="business.html">工商合作 / Business</a></li>
                <li><a href="guidelines.html">社群規範 / Guidelines</a></li>
                <li><a href="audition.html" class="active">藝人徵選 / Audition</a></li>
                <li><a href="partner.html">合作夥伴 / Partner</a></li>
            </ul>
            <div class="official-socials">
                <div class="social-title">OFFICIAL LINKS</div>
                <div class="social-grid">
                    <a href="https://www.facebook.com/profile.php?id=61594036010677" class="social-icon" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/moral.entertainment.co/" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.threads.com/@moral.entertainment.co" class="social-icon" target="_blank"><i class="fa-brands fa-threads"></i></a>
                    <a href="https://x.com/moralentertain" class="social-icon" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://discord.gg/QrUsnqxXQa" class="social-icon" target="_blank"><i class="fa-brands fa-discord"></i></a>
                    <a href="https://www.twitch.tv/moralentertainment" class="social-icon" target="_blank"><i class="fa-brands fa-twitch"></i></a>
                    <a href="mailto:moral.entertainment.co@gmail.com" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="audition-hero">
                <h1>MORAL 寓意娛樂<br>虛擬藝人常態徵選</h1>
                <p>我們期盼在接下來帶來更不一樣的內容與方向。<br>只要你有長才，我們都歡迎你加入寓意，成為溫暖世界的太陽！</p>
            </div>

            <!-- 線上報名表單區塊 -->
            <div class="section-block" id="apply-form">
                <h2><i class="fa-solid fa-file-signature"></i> 徵選報名表單</h2>
                <div class="section-desc">請確實填寫以下資訊，才藝展示影片建議長度為 3-5 分鐘（無須露臉，展現您的聲音魅力與特質即可）。</div>
                
                <div class="form-container">
                    <form id="auditionForm" action="https://formsubmit.co/moral.entertainment.co@gmail.com" method="POST">
                        <input type="hidden" name="_subject" value="【藝人徵選申請】來自官網的熱血報名！">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="false">

                        <div class="form-row">
                            <div class="form-group">
                                <label>真實姓名 / 常用暱稱 *</label>
                                <input type="text" name="姓名或暱稱" class="form-control" required placeholder="請輸入姓名或暱稱">
                            </div>
                            <div class="form-group">
                                <label>出生年月日 *</label>
                                <input type="date" name="生日" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>聯絡信箱 Email *</label>
                                <input type="email" name="email" class="form-control" required placeholder="example@mail.com">
                            </div>
                            <div class="form-group">
                                <label>Discord ID *</label>
                                <input type="text" name="Discord_ID" class="form-control" required placeholder="例如：moral_vtuber#1234">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>目前經營的頻道/社群連結 (若無經驗請填「無」) *</label>
                            <input type="text" name="社群連結" class="form-control" required placeholder="YouTube, Twitch, 或 X (Twitter) 連結">
                        </div>

                        <div class="form-group">
                            <label>才藝展示影片連結 (YouTube 不公開連結 或 Google 雲端硬碟) *</label>
                            <input type="url" name="徵選影片連結" class="form-control" required placeholder="請貼上影片網址，並確保開啟權限">
                        </div>

                        <div class="form-group">
                            <label>專長與加分條件簡述 *</label>
                            <input type="text" name="專長簡述" class="form-control" required placeholder="例如：擅長 FPS 遊戲、精通日文、有影片剪輯經驗等...">
                        </div>

                        <div class="form-group">
                            <label>自我介紹與為什麼想加入寓意娛樂？ *</label>
                            <textarea name="自我介紹與動機" class="form-control" required placeholder="請讓我們多認識你一點！分享你的實況風格、個性，或是未來想達成的目標。"></textarea>
                        </div>
                        
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
                            <input type="checkbox" required id="consentCheck" style="width: 18px; height: 18px; cursor: pointer;">
                            <label for="consentCheck" style="margin-bottom: 0; font-size: 13.5px; color: var(--text-sub); cursor: pointer;">我已詳細閱讀徵選條件與注意事項，並保證所填寫資料均為屬實。</label>
                        </div>

                        <button type="submit" id="submitBtnAudition" class="btn-apply">送出報名表</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- 背景發送腳本 (防跳轉) -->
    <script>
        document.getElementById('auditionForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const form = e.target;
            const btn = document.getElementById('submitBtnAudition');
            const originalText = btn.innerText;

            btn.innerText = '履歷傳送中...';
            btn.disabled = true;

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    alert('您的徵選報名已成功送出！若通過書面審查，我們將主動透過 Email 與您聯繫。');
                    form.reset(); 
                } else {
                    alert('表單送出發生錯誤，請稍後再試。');
                }
            })
            .catch(error => {
                alert('網路連線異常，請確認網路狀態。');
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
