<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工商合作 | MORAL 寓意娛樂</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .form-container { background: var(--surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 700px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        .form-control { width: 100%; padding: 12px 16px; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-family: inherit; }
        .form-control:focus { outline: none; border-color: var(--moral-purple); }
        textarea.form-control { min-height: 150px; resize: vertical; }
        
        .btn-apply { display: block; width: 100%; text-align: center; background: var(--moral-gradient); color: #000; padding: 16px; border-radius: 8px; font-weight: 700; font-size: 16px; text-decoration: none; letter-spacing: 2px; border: none; cursor: pointer; transition: opacity 0.3s; }
        .btn-apply:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <a href="index.html"><img src="IMG_7225.png" alt="MORAL" class="sidebar-logo"></a>
            <ul class="nav-menu">
                <li><a href="index.html">首頁 / Home</a></li>
                <li><a href="business.html" class="active">工商合作 / Business</a></li>
                <li><a href="guidelines.html">社群規範 / Guidelines</a></li>
                <li><a href="audition.html">藝人徵選 / Audition</a></li>
                <li><a href="partner.html">合作夥伴 / Partner</a></li>
            </ul>
            
            <div class="official-socials">
                <div class="social-title">OFFICIAL LINKS</div>
                <div class="social-grid">
                    <a href="https://www.facebook.com/profile.php?id=61594036010677" class="social-icon" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/moral.entertainment.co/" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.threads.com/@moral.entertainment.co" class="social-icon" target="_blank"><i class="fa-brands fa-threads"></i></a>
                    <a href="https://x.com/moralentertain" class="social-icon" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://discord.gg/QrUsnqxXQa" class="social-icon" target="_blank"><i class="fa-brands fa-discord"></i></a>
                    <a href="https://www.twitch.tv/moralentertainment" class="social-icon" target="_blank"><i class="fa-brands fa-twitch"></i></a>
                    <a href="mailto:moral.entertainment.co@gmail.com" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">工商與專案合作</h1>
            <p style="margin-bottom: 40px; color: var(--text-sub); line-height: 1.8;">
                無論是遊戲專場實況、情境置入、短影音授權，或是 IP 聯名企劃，請填寫下方表單，專人將盡快與您聯繫。
            </p>

            <div class="form-container">
                <form id="bizForm" action="https://formsubmit.co/moral.entertainment.co@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="【工商合作】來自官網的合作邀約！">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="false">

                    <div class="form-group">
                        <label>貴單位 / 品牌名稱 *</label>
                        <input type="text" name="品牌名稱" class="form-control" required placeholder="請輸入品牌名稱">
                    </div>
                    <div class="form-group">
                        <label>聯絡信箱 Email *</label>
                        <input type="email" name="email" class="form-control" required placeholder="example@brand.com">
                    </div>
                    <div class="form-group">
                        <label>希望合作的藝人</label>
                        <select name="希望合作藝人" class="form-control">
                            <option value="由官方推薦適合人選">由官方推薦適合人選</option>
                            <option value="艾爾默 (Ailmer_Akuma)">艾爾默 (Ailmer_Akuma)</option>
                            <option value="0913lu (小鹿9)">0913lu (小鹿9)</option>
                            <option value="阿令啦 (rling0511)">阿令啦 (rling0511)</option>
                            <option value="條碼狐狸 (i1i1ifox)">條碼狐狸 (i1i1ifox)</option>
                            <option value="藍莓起司 (BlueberryCheese69)">藍莓起司 (BlueberryCheese69)</option>
                            <option value="麥克關子 (mikeke0423)">麥克關子 (mikeke0423)</option>
                            <option value="舞瞳喵 (HitomiCyan)">舞瞳喵 (HitomiCyan)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>合作內容簡述 *</label>
                        <textarea name="合作內容簡述" class="form-control" required placeholder="請簡述預計推廣的產品、預算區間或檔期需求..."></textarea>
                    </div>
                    <button type="submit" id="submitBtnBiz" class="btn-apply">送出需求表單</button>
                </form>
            </div>
        </main>
    </div>

    <!-- 背景發送腳本 (防跳轉) -->
    <script>
        document.getElementById('bizForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const form = e.target;
            const btn = document.getElementById('submitBtnBiz');
            const originalText = btn.innerText;

            btn.innerText = '信件傳送中...';
            btn.disabled = true;

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    alert('感謝您的來信！寓意娛樂商務團隊已收到您的合作需求，我們將盡快與您聯繫。');
                    form.reset(); 
                } else {
                    alert('表單送出發生錯誤，請稍後再試。');
                }
            })
            .catch(error => {
                alert('網路連線異常，請確認網路狀態。');
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
