<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工商合作 | MORAL 寓意娛樂</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050508;
            --surface: #0e0f17;
            --border-color: #232238;
            --moral-purple: #c494f9;
            --moral-pink: #fca4d4;
            --moral-gradient: linear-gradient(135deg, #8ea6ff 0%, #c494f9 50%, #fca4d4 100%);
            --text-main: #f0edf6;
            --text-sub: #9e9cb8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border-color);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .sidebar-logo {
            width: 100%;
            max-width: 150px;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-menu a {
            color: var(--text-sub);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .nav-menu a:hover, .nav-menu a.active {
            background: rgba(196, 148, 249, 0.15);
            color: var(--moral-pink);
            font-weight: bold;
        }

        .main-wrapper {
            flex: 1;
            margin-left: 260px;
            display: flex;
            justify-content: center;
            padding: 50px 40px;
        }

        .main-content {
            width: 100%;
            max-width: 850px;
        }

        .page-title {
            color: #fff;
            font-size: 28px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .form-container { 
            background: var(--surface); 
            padding: 40px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            margin-top: 20px;
        }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        .form-control { width: 100%; padding: 12px 16px; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-family: inherit; }
        .form-control:focus { outline: none; border-color: var(--moral-purple); }
        textarea.form-control { min-height: 150px; resize: vertical; }
        
        .btn-apply { display: block; width: 100%; text-align: center; background: var(--moral-gradient); color: #050508; padding: 16px; border-radius: 25px; font-weight: 700; font-size: 15px; text-decoration: none; letter-spacing: 2px; border: none; cursor: pointer; transition: opacity 0.3s; }
        .btn-apply:hover { opacity: 0.9; }

        @media (max-width: 900px) {
            .sidebar { position: relative; width: 100%; height: auto; }
            .main-wrapper { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div>
                <a href="index.html"><img src="IMG_7225.png" alt="MORAL" class="sidebar-logo"></a>
                <ul class="nav-menu">
                    <li><a href="index.html">首頁 / Home</a></li>
                    <li><a href="business.html" class="active">工商合作 / Business</a></li>
                    <li><a href="guidelines.html">社群規範 / Guidelines</a></li>
                    <li><a href="audition.html">藝人徵選 / Audition</a></li>
                    <li><a href="partner.html">合作夥伴 / Partner</a></li>
                </ul>
            </div>
            <div style="font-size: 12px; color: var(--text-sub); text-align: center; margin-top: 20px;">
                &copy; MORAL Entertainment
            </div>
        </aside>

        <div class="main-wrapper">
            <main class="main-content">
                <h1 class="page-title">工商與專案合作</h1>
                <p style="margin-bottom: 30px; color: var(--text-sub); line-height: 1.8;">
                    無論是遊戲專場實況、情境置入、短影音授權，或是 IP 聯名企劃，請填寫下方表單，專人將盡快與您聯繫。
                </p>

                <div class="form-container">
                    <form id="bizForm" action="https://formsubmit.co/moral.entertainment.co@gmail.com" method="POST">
                        <input type="hidden" name="_subject" value="【工商合作】來自官網的合作邀約！">
                        <input type="hidden" name="_captcha" value="false">
                        <input type="hidden" name="_next" value="false">

                        <div class="form-group">
                            <label>貴單位 / 品牌名稱 *</label>
                            <input type="text" name="品牌名稱" class="form-control" required placeholder="請輸入品牌名稱">
                        </div>
                        <div class="form-group">
                            <label>聯絡信箱 Email *</label>
                            <input type="email" name="email" class="form-control" required placeholder="example@brand.com">
                        </div>
                        <div class="form-group">
                            <label>希望合作的藝人</label>
                            <select name="希望合作藝人" class="form-control">
                                <option value="由官方推薦適合人選">由官方推薦適合人選</option>
                                <option value="艾爾默 (Ailmer_Akuma)">艾爾默 (Ailmer_Akuma)</option>
                                <option value="0913lu (小鹿9)">0913lu (小鹿9)</option>
                                <option value="阿令啦 (rling0511)">阿令啦 (rling0511)</option>
                                <option value="條碼狐狸 (i1i1ifox)">條碼狐狸 (i1i1ifox)</option>
                                <option value="藍莓起司 (BlueberryCheese69)">藍莓起司 (BlueberryCheese69)</option>
                                <option value="麥克關子 (mikeke0423)">麥克關子 (mikeke0423)</option>
                                <option value="舞瞳喵 (HitomiCyan)">舞瞳喵 (HitomiCyan)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>合作內容簡述 *</label>
                            <textarea name="合作內容簡述" class="form-control" required placeholder="請簡述預計推廣的產品、預算區間或檔期需求..."></textarea>
                        </div>
                        <button type="submit" id="submitBtnBiz" class="btn-apply">送出需求表單</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('bizForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const form = e.target;
            const btn = document.getElementById('submitBtnBiz');
            const originalText = btn.innerText;

            btn.innerText = '信件傳送中...';
            btn.disabled = true;

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    alert('感謝您的來信！寓意娛樂商務團隊已收到您的合作需求，我們將盡快與您聯繫。');
                    form.reset(); 
                } else {
                    alert('表單送出發生錯誤，請稍後再試。');
                }
            })
            .catch(error => {
                alert('網路連線異常，請確認網路狀態。');
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
