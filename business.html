<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工商合作 | MORAL 寓意娛樂</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .form-container { background: var(--surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 700px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        .form-control { width: 100%; padding: 12px 16px; background: var(--bg-deep); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-family: inherit; }
        .form-control:focus { outline: none; border-color: var(--moral-purple); }
        textarea.form-control { min-height: 150px; resize: vertical; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <a href="index.html"><img src="IMG_7225.png" alt="MORAL" class="sidebar-logo"></a>
            <ul class="nav-menu">
                <li><a href="index.html">首頁 / Home</a></li>
                <li><a href="business.html" class="active">工商合作 / Business</a></li>
                <li><a href="guidelines.html">社群規範 / Guidelines</a></li>
                <li><a href="audition.html">藝人徵選 / Audition</a></li>
                <li><a href="partner.html">合作夥伴 / Partner</a></li>
            </ul>
            
            <div class="official-socials">
                <div class="social-title">OFFICIAL LINKS</div>
                <div class="social-grid">
                    <a href="https://www.facebook.com/profile.php?id=61594036010677" class="social-icon" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/moral.entertainment.co/" class="social-icon" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.threads.com/@moral.entertainment.co" class="social-icon" target="_blank"><i class="fa-brands fa-threads"></i></a>
                    <a href="https://x.com/moralentertain" class="social-icon" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://discord.gg/QrUsnqxXQa" class="social-icon" target="_blank"><i class="fa-brands fa-discord"></i></a>
                    <a href="https://www.twitch.tv/moralentertainment" class="social-icon" target="_blank"><i class="fa-brands fa-twitch"></i></a>
                    <a href="mailto:moral.entertainment.co@gmail.com" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">工商與專案合作</h1>
            <p style="margin-bottom: 40px; color: var(--text-sub); line-height: 1.8;">
                無論是遊戲專場實況、情境置入、短影音授權，或是 IP 聯名企劃，請填寫下方表單或直接來信 <b>moral.entertainment.co@gmail.com</b>，專人將盡快與您聯繫。
            </p>

            <div class="form-container">
                <!-- 加上 id="bizForm" 供 JavaScript 綁定 -->
                <form id="testForm" action="https://formsubmit.co/moral.entertainment.co@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="【MORAL 商務洽詢】來自官網的新合作需求！">
                    <input type="hidden" name="_captcha" value="false">

                    <div class="form-group">
                        <label>貴單位 / 品牌名稱</label>
                        <input type="text" name="品牌名稱" class="form-control" required placeholder="請輸入品牌名稱">
                    </div>
                    <div class="form-group">
                        <label>聯絡信箱 Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="example@brand.com">
                    </div>
                    <div class="form-group">
                        <label>希望合作的藝人</label>
                        <select name="合作對象" class="form-control">
                            <option>由官方推薦適合人選</option>
                            <option>愛爾梅爾 (Ailmer_Akuma)</option>
                            <option>舞瞳喵 (HitomiCyan)</option>
                            <option>條碼狐狸 (i1i1ifox)</option>
                            <option>阿令啦 (rling0511)</option>
                            <option>麥克關子 (mikeke0423)</option>
                            <option>小鹿9 (0913lu)</option>
                            <option>藍莓起司 (BlueberryCheese69)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>合作內容簡述</label>
                        <textarea name="合作內容" class="form-control" required placeholder="請簡述預計推廣的產品、預算區間或檔期需求..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">送出需求表單</button>
                </form>
            </div>
        </main>
    </div>

    <!-- 加入 AJAX 背景發送腳本 -->
    <script>
        document.getElementById('bizForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止網頁跳轉

            const form = e.target;
            const formData = new FormData(form);
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerText;

            // 更改按鈕狀態防止重複點擊
            btn.innerText = '傳送中...';
            btn.disabled = true;

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    alert('感謝您的來信！寓意娛樂商務團隊已收到您的合作需求，我們將盡快與您聯繫。');
                    form.reset(); // 清空表單
                } else {
                    alert('表單送出發生錯誤，請直接來信 moral.entertainment.co@gmail.com');
                }
            })
            .catch(error => {
                alert('網路連線異常，請確認網路狀態或直接來信 moral.entertainment.co@gmail.com');
            })
            .finally(() => {
                // 恢復按鈕狀態
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
